line-length = 88
target-version = "py311"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    ".github",
]

[lint]
select = [
    "E", "W", "F", "I", "B", "C4", "UP",
    "ARG", "SIM", "TCH", "PTH", "N", "PL", "RUF",
]
ignore = [
    "E501",
    "B008",
    "PLR0913",
    "PLR2004",
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["PLR2004", "S101", "ARG"]

[lint.isort]
# Override in repo-root ruff.toml: known-first-party = ["your_package"]

[lint.pydocstyle]
convention = "google"
